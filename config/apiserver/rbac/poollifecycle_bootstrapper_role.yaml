apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: compute.ironcore.dev:system:pool-lifecycle-controllers-bootstrapper
rules:
  - apiGroups:
      - certificates.k8s.io
    resources:
      - certificatesigningrequests
    verbs:
      - create
      - get
      - list
      - watch
  - apiGroups:
      - certificates.k8s.io
    resources:
      - certificatesigningrequests/poollifecycleclient
    verbs:
      - create
