apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: compute.ironcore.dev:system:pool-lifecycle-controllers
rules:
- apiGroups:
  - compute.ironcore.dev
  resources:
  - machinepools
  verbs:
